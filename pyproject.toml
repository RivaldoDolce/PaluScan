[project]
name = "paluscan"
version = "0.1.0"
description = "Détection du paludisme sur frottis sanguins par deep learning, déployable en démonstration web."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "python-fasthtml>=0.14",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "pillow>=11.0",
]

[dependency-groups]
train = [
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "torch>=2.9",
]
eval = ["scikit-learn>=1.7", "matplotlib>=3.10"]
dev = ["pytest>=8.3", "ruff>=0.8"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paluscan"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["E501", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
